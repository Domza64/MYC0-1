services:
  db:
    image: postgres:18
    restart: always
    ports:
      - "5432:5432"
    # set shared memory limit when using docker compose
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: myco
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

volumes:
  postgres_data:
