info:
  name: get play history
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/songs/history?limit=2"
  params:
    - name: limit
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
