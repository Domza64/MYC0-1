info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/auth/login"
  body:
    type: form-urlencoded
    data:
      - name: username
        value: admin
      - name: password
        value: admin

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
